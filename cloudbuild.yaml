steps:
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/$PROJECT_ID/shakambhari-invoices:$SHORT_SHA', '.']
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/$PROJECT_ID/shakambhari-invoices:$SHORT_SHA']
- name: 'gcr.io/cloud-builders/gcloud'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      gcloud run deploy shakambhari-invoices-529104378195 \
        --image gcr.io/$PROJECT_ID/shakambhari-invoices:$SHORT_SHA \
        --region asia-south1 \
        --platform managed \
        --allow-unauthenticated \
        --set-env-vars FLASK_ENV=production
images:
- 'gcr.io/$PROJECT_ID/shakambhari-invoices:$SHORT_SHA'
